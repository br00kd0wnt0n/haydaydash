<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D56A"/>
      <stop offset="100%" style="stop-color:#E8A83A"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B9B4D"/>
      <stop offset="100%" style="stop-color:#5B8C3E"/>
    </linearGradient>
  </defs>

  <!-- Barn/silo icon -->
  <g transform="translate(5, 5)">
    <!-- Silo -->
    <rect x="0" y="20" width="16" height="30" rx="2" fill="url(#goldGrad)"/>
    <ellipse cx="8" cy="20" rx="8" ry="4" fill="#F5D56A"/>
    <!-- Barn -->
    <rect x="20" y="25" width="30" height="25" fill="#B8433E"/>
    <polygon points="20,25 35,10 50,25" fill="#C85450"/>
    <rect x="30" y="35" width="10" height="15" fill="#8B3330"/>
    <!-- Hay -->
    <ellipse cx="8" cy="48" rx="10" ry="5" fill="url(#goldGrad)"/>
  </g>

  <!-- Text: HAY DAY -->
  <text x="65" y="38" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="800" fill="#3D2914">
    <tspan fill="url(#goldGrad)">HAY</tspan>
    <tspan dx="5" fill="url(#greenGrad)">DAY</tspan>
  </text>

  <!-- Wheat accent -->
  <g transform="translate(180, 15)" fill="#E8A83A">
    <ellipse cx="0" cy="0" rx="3" ry="8" transform="rotate(-20)"/>
    <ellipse cx="5" cy="2" rx="3" ry="8" transform="rotate(0)"/>
    <ellipse cx="10" cy="0" rx="3" ry="8" transform="rotate(20)"/>
    <rect x="3" y="8" width="4" height="20" fill="#5B8C3E"/>
  </g>
</svg>
